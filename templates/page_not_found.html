{% extends "base.html" %}

{% block title %}Shortly Studio | Page not found{% endblock %}

{% block main %}

<section class="surface-card error-layout">
    <span class="eyebrow">404 error</span>
    <h1>This short link does not exist.</h1>
    <p class="hero-text">
        The alias may have been removed, renamed, or never created. Head back to the dashboard and generate a fresh link.
    </p>
    <div class="action-row centered">
        <a class="button button-primary" href="{{ url_for('index') }}">Return home</a>
    </div>
</section>

{% endblock %}
